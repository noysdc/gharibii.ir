# اجرای خودکار: هر بار فایل محصول (.md) یا اسکریپت تغییر کرد، توضیحات/هشتگ‌ها/سایزها را به‌روز می‌کند.
name: Enrich products
on:
  push:
    branches: [main]
    paths:
      - "_products/**/*.md"
      - "scripts/product_catalog.py"
      - "scripts/enrich_products.py"
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/enrich_products.py
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A _products
          git diff --cached --quiet || git commit -m "به‌روزرسانی خودکار توضیحات و هشتگ محصولات"
          git push
