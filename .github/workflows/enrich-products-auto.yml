# اختیاری: بعد از هر push که فایل محصول عوض کند، خودکار اجرا می‌شود.
# اگر فقط اجرای دستی می‌خواهید، این فایل را حذف کنید.
name: Enrich products (auto on push)
on:
  push:
    branches: [main]
    paths:
      - "_products/**/*.md"
permissions:
  contents: write
concurrency:
  # Same lock as product-updates.yml because both workflows write to _products.
  group: product-content-writes
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/enrich_products.py
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A _products
          if ! git diff --cached --quiet; then
            git commit -m "به‌روزرسانی خودکار محصولات"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push attempt ${attempt} failed; retrying after refresh."
              sleep 2
            done
            echo "Unable to push enriched products after 3 attempts."
            exit 1
          fi
