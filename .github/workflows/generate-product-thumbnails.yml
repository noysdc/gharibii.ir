name: Generate product thumbnails

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "assets/images/products/**"
      - "scripts/generate_product_thumbnails.py"
      - ".github/workflows/generate-product-thumbnails.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image processor
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate thumbnails
        run: python scripts/generate_product_thumbnails.py --force

      - name: Commit generated thumbnails
        run: |
          if [ -z "$(git status --porcelain -- assets/images/products)" ]; then
            echo "No thumbnail changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/images/products
          git commit -m "Generate optimized product thumbnails [skip ci]"
          git push
