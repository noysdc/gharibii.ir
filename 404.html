<div class="wrap notfound">
  <h1>این صفحه پیدا نشد</h1>
  <p class="lead">ممکن است آدرس قدیمی باشد. از این‌جا ادامه دهید:</p>
  <p><a class="btn" href="{{ '/' | relative_url }}">صفحه اصلی</a> <a class="btn alt" href="{{ '/girls/' | relative_url }}">دخترانه</a> <a class="btn alt" href="{{ '/boys/' | relative_url }}">پسرانه</a></p>
</div>
<script>
(function () {
  /* عنوان بالا برای پیش‌نمایش لینک فاکتور (/f/…) است؛ برای بازدیدکنندهٔ صفحهٔ واقعاً گم‌شده برمی‌گردد */
  if (!/\/f\/\d{6}-\d{4}-/.test(location.pathname)) { document.title = 'صفحه پیدا نشد | ' + (document.title.split(' | ')[1] || ''); }
  var map = {{ site.data.redirects | jsonify }} || [];
  var base = {{ site.baseurl | jsonify }};
  /* لینک کوتاه فاکتور:  gharibii.ir/f/050803-1432-k7q2  ← صفحهٔ فاکتور */
  var sm = location.pathname.match(/\/f\/(\d{6}-\d{4}-[a-z2-9]{4,16})\/?$/);
  if (sm) { document.documentElement.style.visibility = 'hidden'; location.replace(base + '/invoice/#' + sm[1]); return; }
  var here = decodeURIComponent(location.pathname + location.search).replace(/\/+$/, '');
  if (base && here.indexOf(base) === 0) here = here.slice(base.length);
  for (var i = 0; i < map.length; i++) {
    var from = decodeURIComponent(map[i].from).replace(/\/+$/, '');
    if (from === here) { location.replace(base + map[i].to); return; }
  }
})();
</script>
