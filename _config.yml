# ---------- تنظیمات اصلی ----------
title: فروشگاه غریبی کیش
description: "لباس شخصیتی دخترانه و پسرانه، پرنسسی و ابرقهرمانی، با قیمت و عکس واقعی؛ سفارش در واتساپ"
lang: fa

# ---------- آدرس سایت ----------
url: "https://gharibii.ir"
baseurl: ""

# ---------- شماره‌های واتساپ ----------
whatsapp_numbers:
  - "989347688356"
  - "989179962005"

# ---------- فروشنده‌ها (واتساپ) ----------
whatsapp_sellers:
  - name: "سمانه غریبی"
    number: "989347688356"
    photo: "/assets/images/sellers/seller-1.webp"
  - name: "سمیه غریبی"
    number: "989179962005"
    photo: "/assets/images/sellers/seller-2.webp"

phone_display: "076-44561403"
phone_e164: "+987644561403"
address: "جزیره زیبای کیش — بازار عرب‌ها 🏝️"

# ---------- نقشه ----------
map_name: "فروشگاه غریبی"
map_lat: 26.54233
map_lng: 54.0193253
map_url: "https://maps.app.goo.gl/YtjBNcVfiDYY33XC9"

# ---------- صفحه‌های ثابت ----------
size_guide_url: "/size-guide/"

# ---------- محصولات ----------
collections:
  products:
    output: true
    permalink: /products/:path/

defaults:
  - scope:
      path: ""
      type: products
    values:
      layout: product
  - scope: { path: "_products/girls", type: products }
    values: { category: girls }
  - scope: { path: "_products/boys", type: products }
    values: { category: boys }
  - scope: { path: "_products/bags-shoes", type: products }
    values: { category: bags-shoes }
  - scope: { path: "_products/wands-crowns", type: products }
    values: { category: crown-wand }
  - scope: { path: "_products/accessories", type: products }
    values: { category: accessories }

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

exclude:
  - README.md
  - CHANGES.md
  - scripts
  - worker
  - Gemfile
  - Gemfile.lock

# ---------- روش‌های دیگر سفارش ----------
order_telegram: "gharibii_ir"
# آیدی‌های بله به صورت لیست تعریف شدند تا هر کدام به یک فروشنده متصل شود
order_bale:
  - "garibistore16"
  - "gharibi_2005"
order_instagram: "storegaribi16"
# کانال تلگرام فروشگاه (در پایین پست‌های کانال نمایش داده می‌شود)
channel_telegram: "Gharibii_irr"

# ---------- هزینه ارسال + گمرک ----------
# ⚠️ اینجا را برای تغییر هزینه ویرایش کن. مبلغ به تومان، برای هر سفارش (یک‌جا، شامل ارسال و گمرک)
# مثال: ۴۵۰ هزار تومان = 450000
shipping_customs_cost: 450000

# ---------- پرداخت ----------
# ۱) درگاه زرین‌پال (بدون لینک): true = دکمهٔ «پرداخت آنلاین» مبلغ را از Worker می‌گیرد و مشتری به صفحهٔ بانک می‌رود.
#    لازم: Secret با نام MERCHANT_ID در Worker (کد درگاه را هرگز اینجا ننویس؛ ریپو عمومی است).
payment_gateway: true
# ۲) لینک پرداخت قدیمی زرین‌پال (اختیاری): فقط وقتی استفاده می‌شود که درگاه بالا خاموش یا فاکتور لینک کوتاه نداشته باشد.
payment_link: ""
# ۳) کارت‌به‌کارت / شبا: خالی بماند = این بخش نمایش داده نمی‌شود.
bank_sheba: "IR800180000000141069106648"
bank_owner: "سمانه غریبی"

# ---------- سرور فاکتور (Cloudflare Worker): لینک کوتاه، تأیید پرداخت روی همان لینک، گزارش تلگرام ----------
# بعد از دیپلوی Worker آدرسش را اینجا بگذار، مثلاً "https://gharibii-invoices.نام‌شما.workers.dev"
# خالی بماند = مثل قبل با لینک‌های بلند کار می‌کند.
invoice_api: "https://gharibii-invoices.samaneh-gharibi1982.workers.dev"