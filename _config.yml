# ---------- تنظیمات اصلی ----------
title: فروشگاه غریبی کیش
description: پوشاک دخترانه و پسرانه — قیمت و عکس محصولات، خرید تلفنی و واتساپ
lang: fa

# هنگام تست روی github.io:  url و baseurl را مثل پایین بگذارید
# بعد از وصل کردن دامنه:    url: "https://gharibii.ir"   و   baseurl: ""
url: "https://noysdc.github.io"
baseurl: "/gharibii.ir"

# ---------- شماره‌های واتساپ (بدون + و صفر اول، با کد کشور) ----------
whatsapp_numbers:
  - "989347688356"
  - "989179962005"

# ---------- فروشنده‌ها (دکمه‌های واتساپ بعد از «ثبت سفارش») ----------
# عکس: مربع ۱۶۰×۱۶۰ پیکسل، فرمت webp، داخل assets/images/sellers/
# اگر شماره را اینجا عوض می‌کنید، در whatsapp_numbers بالا هم عوض کنید (فوتر از آن می‌خواند)
whatsapp_sellers:
  - name: "فروشنده ۱"
    number: "989347688356"
    photo: "/assets/images/sellers/seller-1.webp"
  - name: "فروشنده ۲"
    number: "989179962005"
    photo: "/assets/images/sellers/seller-2.webp"

phone_display: "076-44561403"
address: "جزیره زیبای کیش — بازار عرب‌ها 🏝️"

# ---------- محصولات ----------
collections:
  products:
    output: true
    permalink: /products/:path/

defaults:
  - scope:
      path: ""
      type: products
    values:
      layout: product
  - scope: { path: "_products/girls", type: products }
    values: { category: girls }
  - scope: { path: "_products/boys", type: products }
    values: { category: boys }
  - scope: { path: "_products/bags-shoes", type: products }
    values: { category: bags-shoes }
  - scope: { path: "_products/crown-wand", type: products }
    values: { category: crown-wand }
  - scope: { path: "_products/accessories", type: products }
    values: { category: accessories }

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

exclude:
  - README.md
  - scripts    # ← از tools به scripts تغییر کرد
  - Gemfile
  - Gemfile.lock