# ---------- تنظیمات اصلی ----------
title: فروشگاه غریبی کیش
description: پوشاک دخترانه و پسرانه — قیمت و عکس محصولات، خرید تلفنی و واتساپ
lang: fa

# ---------- آدرس سایت ----------
# حالت تست (تا وقتی دامنه به GitHub وصل نشده):
url: "https://noysdc.github.io"
baseurl: "/gharibii.ir"
# روز انتقال دامنه این دو خط بالا را با دو خط زیر عوض کنید و فایل CNAME (محتوا: gharibii.ir) را به ریشهٔ ریپو اضافه کنید:
# url: "https://gharibii.ir"
# baseurl: ""

# ---------- شماره‌های واتساپ (بدون + و صفر اول، با کد کشور) ----------
whatsapp_numbers:
  - "989347688356"
  - "989179962005"

# ---------- فروشنده‌ها (دکمه‌های واتساپ بعد از «ثبت سفارش») ----------
# عکس: مربع ۱۶۰×۱۶۰ پیکسل، فرمت webp، داخل assets/images/sellers/
# اگر شماره را اینجا عوض می‌کنید، در whatsapp_numbers بالا هم عوض کنید (فوتر از آن می‌خواند)
whatsapp_sellers:
  - name: "فروشنده ۱"
    number: "989347688356"
    photo: "/assets/images/sellers/seller-1.webp"
  - name: "فروشنده ۲"
    number: "989179962005"
    photo: "/assets/images/sellers/seller-2.webp"

phone_display: "076-44561403"
phone_e164: "+987644561403"
address: "جزیره زیبای کیش — بازار عرب‌ها 🏝️"

# ---------- نقشه (فوتر) ----------
map_name: "فروشگاه غریبی"
map_lat: 26.54233
map_lng: 54.0193253
map_url: "https://maps.app.goo.gl/YtjBNcVfiDYY33XC9"

# ---------- صفحه‌های ثابت ----------
size_guide_url: "/size-guide/"

# ---------- محصولات ----------
collections:
  products:
    output: true
    permalink: /products/:path/

defaults:
  - scope:
      path: ""
      type: products
    values:
      layout: product
  - scope: { path: "_products/girls", type: products }
    values: { category: girls }
  - scope: { path: "_products/boys", type: products }
    values: { category: boys }
  - scope: { path: "_products/bags-shoes", type: products }
    values: { category: bags-shoes }
  - scope: { path: "_products/crown-wand", type: products }
    values: { category: crown-wand }
  - scope: { path: "_products/accessories", type: products }
    values: { category: accessories }

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

exclude:
  - README.md
  - CHANGES.md
  - scripts
  - Gemfile
  - Gemfile.lock

# ---------- روش‌های دیگر سفارش (برای کسانی که واتساپ ندارند) ----------
# هر کدام را خالی بگذارید، دکمه‌اش در سایت نمایش داده نمی‌شود.
order_telegram: "gharibii_ir"      # آیدی تلگرام بدون @
order_bale: "garibistore16"                     # آیدی بله بدون @ ، مثلاً gharibii  ← لینک: https://ble.ir/gharibii
order_instagram: "storegaribi16"   # آیدی اینستاگرام بدون @ (دایرکت)

# ---------- هزینه ارسال ----------
# این عدد به تومان است و در پیام واتساپ و کپی متن سفارش به جمع کل اضافه می‌شود.
shipping_cost: 450000