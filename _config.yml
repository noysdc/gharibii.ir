# ---------- تنظیمات اصلی ----------
title: فروشگاه غریبی کیش
description: پوشاک دخترانه و پسرانه — قیمت و عکس محصولات، خرید تلفنی و واتساپ
lang: fa

# ---------- تنظیمات آدرس ----------
# برای تست روی github.io از این دو خط استفاده کن:
url: "https://noysdc.github.io"
baseurl: "/gharibii.ir"

# بعد از وصل کردن دامنه، دو خط بالا رو پاک کن و این‌ها رو بذار:
# url: "https://gharibii.ir"
# baseurl: ""

# ---------- تم ----------
# تم پیش‌فرض گیت‌هاب رو غیرفعال می‌کنیم تا از layoutهای خودت استفاده بشه
theme: null

# ---------- شماره‌های واتساپ ----------
whatsapp_numbers:
  - "989347688356"
  - "989179962005"

phone_display: "076-44561403"
address: "جزیره زیبای کیش — بازار عرب‌ها 🏝️"

# ---------- محصولات ----------
collections:
  products:
    output: true
    permalink: /products/:path/

defaults:
  - scope:
      path: ""
      type: products
    values:
      layout: product

# ---------- پلاگین‌ها ----------
# jekyll-redirect-from حذف شد چون با GitHub Pages سازگار نیست
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - scripts
  - Gemfile
  - Gemfile.lock