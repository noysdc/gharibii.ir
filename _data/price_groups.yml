# گروه‌های قیمتی
# هر محصول با price_group به یکی از این گروه‌ها اشاره می‌کنه (و price در md خالی می‌مونه).
#
# فیلدهای هر گروه:
#   price      قیمت گروه (تومان، بدون کاما)
#   old_price  (اختیاری) قیمت قبلی؛ خط‌خورده + درصد تخفیف نشون داده می‌شه
#   badge      (اختیاری) برچسب روی عکس کارت محصول؛ مثل "تخفیف نوروزی" یا "جدید"
#
# برای فعال کردن، علامت # اول old_price یا badge رو بردار و مقدار بذار.
# برای خاموش کردن، دوباره # بذار یا خط رو پاک کن.
#
# استثنا برای یک محصول خاص (داخل فایل md اون محصول):
#   old_price: 8000000   قیمت قبلی اختصاصی
#   old_price: 0         تخفیف گروه برای این محصول خاموش
#   badge: "پرفروش"      برچسب اختصاصی
#   badge: ""            برچسب گروه برای این محصول خاموش
#   price: 0             تماس بگیرید
#
# نام گروه‌ها رو عوض نکن (محصولات با همین نام بهشون وصل شدن).
# گروه جدید با RUN_SYNC_PRICES.bat ساخته می‌شه (نام: p_<قیمت>)، یا دستی اضافه کن.

