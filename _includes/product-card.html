{%- assign p = include.product -%}
{%- assign card_image = p.images[0] -%}
<a class="card" href="{{ p.url | relative_url }}">
  <span class="card-img">
    {%- if card_image -%}
      <img src="{{ card_image | relative_url }}" alt="{{ p.title | escape }}" loading="lazy" width="600" height="800">
    {%- else -%}
      <div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #eee; color: #999; font-size: 0.9rem;">بدون عکس</div>
    {%- endif -%}
  </span>
  <span class="card-title">{{ p.title }}</span>
  <span class="card-price">{% include price.html product=p %}</span>
</a>
