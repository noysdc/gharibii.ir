    <span>اکسسوری</span>
  </a>
</nav>
<script>
(function () {
  var bar = document.getElementById('ios-tabbar');
  if (!bar) return;
  var mq = window.matchMedia('(max-width: 768px)');
  var ticking = false, SHOW_AFTER = 120;
  function update() {
    ticking = false;
    var y = window.pageYOffset || document.documentElement.scrollTop || 0;
    bar.classList.toggle('is-visible', mq.matches && y > SHOW_AFTER);
  }
  window.addEventListener('scroll', function () {
    if (!ticking) { ticking = true; requestAnimationFrame(update); }
  }, { passive: true });
  window.addEventListener('resize', update);
  /* وقتی کیبورد باز است (جستجو/فرم) نوار پنهان شود */
  document.addEventListener('focusin', function (e) {
    if (e.target && e.target.matches && e.target.matches('input, textarea, select')) bar.classList.add('is-hidden');
  });
  document.addEventListener('focusout', function () { bar.classList.remove('is-hidden'); });
  update();
})();
</script>
