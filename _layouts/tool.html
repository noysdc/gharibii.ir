<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="site-baseurl" content="{{ site.baseurl }}">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#0a6670">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.title }}">
  <meta property="og:title" content="{{ page.title }} | {{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.title }}">
  <meta property="og:image" content="{{ '/assets/images/og-card.jpg' | absolute_url }}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ '/assets/icons/icon-192.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/invoice.css' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}">
</head>
<body class="inv-body {{ page.body_class }}">
{{ content }}
</body>
</html>
