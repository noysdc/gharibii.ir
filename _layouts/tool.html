<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="site-baseurl" content="{{ site.baseurl }}">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#0a6670">
  <meta name="invoice-api" content="{{ site.invoice_api }}">
  <script>
  /* حالت شب/روز: همان کلید سایت (gharibii-theme)؛ اگر انتخاب نشده باشد از تنظیم دستگاه */
  (function () {
    var s = null;
    try { s = localStorage.getItem('gharibii-theme'); } catch (e) {}
    var dark = s ? s === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    if (dark) document.documentElement.setAttribute('data-theme', 'dark');
  })();
  </script>
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.title }}">
  <meta property="og:title" content="{{ page.title }} | {{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.title }}">
  <meta property="og:image" content="{{ '/assets/images/og-card.jpg' | absolute_url }}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ '/assets/icons/icon-192.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/invoice.css' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}">
</head>
<body class="inv-body {{ page.body_class }}">
{{ content }}
<script>
(function () {
  var root = document.documentElement;
  function paint() {
    var dark = root.getAttribute('data-theme') === 'dark';
    Array.prototype.forEach.call(document.querySelectorAll('[data-theme-toggle]'), function (b) { b.textContent = dark ? '☀️' : '🌙'; });
  }
  document.addEventListener('click', function (e) {
    if (!e.target.closest || !e.target.closest('[data-theme-toggle]')) return;
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    if (next === 'dark') root.setAttribute('data-theme', 'dark'); else root.removeAttribute('data-theme');
    try { localStorage.setItem('gharibii-theme', next); } catch (err) {}
    paint();
  });
  paint();
})();
</script>
</body>
</html>
