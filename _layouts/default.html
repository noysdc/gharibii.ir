<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="site-baseurl" content="{{ site.baseurl }}">
  <link rel="manifest" href="{{ '/manifest.webmanifest' | relative_url }}">
  <meta name="theme-color" content="#0a6670">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="غریبی کیش">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ '/assets/icons/icon-192.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/icons/apple-touch-icon.png' | relative_url }}">
  {% seo %}
  {%- assign og_src = page.images[0] -%}
  {%- if og_src -%}
    {%- capture og_rel -%}{% include img.html src=og_src %}{%- endcapture -%}
    <meta property="og:image" content="{{ og_rel | strip | prepend: site.url }}">
    <meta name="twitter:image" content="{{ og_rel | strip | prepend: site.url }}">
  {%- else -%}
    <meta property="og:image" content="{{ '/assets/icons/icon-512.png' | absolute_url }}">
    <meta name="twitter:image" content="{{ '/assets/icons/icon-512.png' | absolute_url }}">
  {%- endif -%}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {%- if page.url == '/' %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ClothingStore",
    "name": {{ site.title | jsonify }},
    "description": {{ site.description | jsonify }},
    "url": {{ site.url | jsonify }},
    "image": {{ '/assets/icons/icon-512.png' | absolute_url | jsonify }},
    "telephone": {{ site.phone_e164 | jsonify }},
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "بازار عرب‌ها",
      "addressLocality": "کیش",
      "addressRegion": "هرمزگان",
      "addressCountry": "IR"
    },
    "geo": {
      "@type": "GeoCoordinates",
      "latitude": {{ site.map_lat | jsonify }},
      "longitude": {{ site.map_lng | jsonify }}
    },
    "hasMap": {{ site.map_url | jsonify }},
    "sameAs": ["https://instagram.com/storegaribi16", "https://t.me/gharibii_ir"]
  }
  </script>
  {%- endif %}
</head>
<body{% if page.layout == 'product' %} class="is-product"{% endif %}>
  {% include header.html %}
  <main>{{ content }}</main>
  {% include footer.html %}
  <script type="application/json" id="wa-sellers-data">[{% if site.whatsapp_sellers %}{% for s in site.whatsapp_sellers %}{"name":{{ s.name | jsonify }},"number":{{ s.number | jsonify }},"photo":{% if s.photo %}{{ s.photo | relative_url | jsonify }}{% else %}""{% endif %}}{% unless forloop.last %},{% endunless %}{% endfor %}{% else %}{% for n in site.whatsapp_numbers %}{"name":"شماره {{ forloop.index }}","number":{{ n | jsonify }},"photo":""}{% unless forloop.last %},{% endunless %}{% endfor %}{% endif %}]</script>
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
