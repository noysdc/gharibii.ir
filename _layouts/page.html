---
layout: default
---
<article class="wrap page-doc">
  <nav class="crumbs doc-width" aria-label="مسیر"><a href="{{ '/' | relative_url }}">خانه</a> / {{ page.title }}</nav>
  <div class="doc-box">
    <h1>{{ page.title }}</h1>
    {% if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
    <div class="prose">
      {{ content }}
    </div>
    {% if page.updated %}<p class="muted page-updated">آخرین بروزرسانی: {{ page.updated }}</p>{% endif %}
  </div>
</article>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    { "@type": "ListItem", "position": 1, "name": "خانه", "item": {{ '/' | absolute_url | jsonify }} },
    { "@type": "ListItem", "position": 2, "name": {{ page.title | jsonify }}, "item": {{ page.url | absolute_url | jsonify }} }
  ]
}
</script>
