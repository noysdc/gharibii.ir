# Worker فاکتورهای فروشگاه غریبی کیش
# راهنمای نصب: SETUP-FA.md
name = "gharibii-invoices"
main = "src/index.js"
compatibility_date = "2025-01-01"

# بعد از ساخت KV (دستور wrangler kv namespace create INVOICES) شناسه‌اش را اینجا بگذار
[[kv_namespaces]]
binding = "INVOICES"
id = "PUT_KV_NAMESPACE_ID_HERE"

# هر روز ساعت ۰۸:۰۰ به وقت تهران (۰۴:۳۰ UTC) اجرا می‌شود؛
# خودش تشخیص می‌دهد شنبه است (گزارش هفتگی) یا اول ماه شمسی (گزارش ماهانه)
[triggers]
crons = ["30 4 * * *"]

[vars]
SITE_URL = "https://gharibii.ir"

# کلیدها را با دستور wrangler secret put وارد کن (داخل این فایل ننویس):
#   SELLER_KEY            رمز فروشنده (هر رمز طولانی دلخواه)
#   TELEGRAM_BOT_TOKEN    توکن ربات تلگرام (از BotFather)
#   TELEGRAM_CHAT_ID      شناسهٔ چت خودت با ربات
# اختیاری (ایمیل با Resend):
#   RESEND_API_KEY, MAIL_TO, MAIL_FROM
